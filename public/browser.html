<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoQawill - فتح في المتصفح</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #021024, #052659);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; margin-bottom: 30px; opacity: 0.9; }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 10px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>مرحباً بك في MoQawill</h1>
        <p>لتجربة أفضل مع جميع الصور والميزات، ننصح بفتح الموقع في المتصفح الخارجي</p>
        
        <a href="https://moqawill.vercel.app" 
           class="btn" 
           target="_blank" 
           rel="noopener noreferrer">
            🔗 فتح في المتصفح الخارجي
        </a>
        
        <a href="https://moqawill.vercel.app" class="btn btn-secondary">
            ⚠️ الاستمرار داخل التطبيق
        </a>
    </div>

    <script>
        // محاولة الكشف عن التطبيق وإظهار رسالة مناسبة
        (function() {
            const userAgent = navigator.userAgent;
            let message = '';
            
            if (userAgent.includes('Telegram')) {
                message = '✅ تم اكتشاف تليجرام. الصور قد لا تظهر بشكل صحيح داخل التطبيق.';
            } else if (userAgent.includes('FB') || userAgent.includes('Instagram')) {
                message = '✅ تم اكتشاف تطبيق فيسبوك. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('WhatsApp')) {
                message = '✅ تم اكتشاف واتساب. الصور قد لا تظهر بشكل صحيح.';
            }
            
            if (message) {
                const p = document.querySelector('p');
                p.innerHTML = message + '<br><br>' + p.innerHTML;
            }
        })();
    </script>
</body>
</html>
