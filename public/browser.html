<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoQawill - فتح في المتصفح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #021024, #052659);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6); }
        }
        
        .logo svg {
            width: 60px;
            height: 60px;
            fill: #3b82f6;
        }
        
        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .warning-box {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            color: #ffc107;
            font-size: 0.95rem;
        }
        
        .warning-box i {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn {
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .remember {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .remember input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .counter {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
            </div>
            
            <h1>مرحباً بك في MoQawill</h1>
            <p>لتجربة تصفح أفضل، ننصح بفتح الموقع في المتصفح الخارجي</p>
            
            <div class="warning-box" id="appWarning">
                <i>📱</i>
                تم اكتشاف أنك تستخدم تطبيق تواصل اجتماعي.
                بعض الصور والميزات قد لا تعمل بشكل صحيح داخل التطبيق.
            </div>
            
            <div class="button-group">
                <a href="https://moqawill.vercel.app" 
                   class="btn btn-primary" 
                   id="openInBrowserBtn"
                   target="_blank" 
                   rel="noopener noreferrer">
                    🔗 فتح في المتصفح الخارجي
                </a>
                
                <a href="#" class="btn btn-secondary" id="continueAnywayBtn">
                    ⚠️ الاستمرار داخل التطبيق
                </a>
            </div>
            
            <div class="remember">
                <input type="checkbox" id="rememberChoice">
                <label for="rememberChoice">لا تسألني مرة أخرى</label>
            </div>
            
            <div class="counter" id="autoRedirectCounter"></div>
        </div>
    </div>
    
    <script>
        (function() {
            // الرابط المستهدف
            const TARGET_URL = 'https://moqawill.vercel.app';
            
            // الكشف عن التطبيق الذي فتح الرابط
            const userAgent = navigator.userAgent;
            let detectedApp = '';
            
            if (userAgent.includes('Telegram')) {
                detectedApp = 'Telegram';
                document.getElementById('appWarning').innerHTML = '<i>📱</i> تم اكتشاف أنك تستخدم تليجرام. الصور قد لا تظهر بشكل صحيح داخل التطبيق.';
            } else if (userAgent.includes('FB') || userAgent.includes('Instagram') || userAgent.includes('Messenger')) {
                detectedApp = 'Facebook';
                document.getElementById('appWarning').innerHTML = '<i>📱</i> تم اكتشاف أنك تستخدم تطبيق فيسبوك أو ماسنجر. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('WhatsApp')) {
                detectedApp = 'WhatsApp';
                document.getElementById('appWarning').innerHTML = '<i>📱</i> تم اكتشاف أنك تستخدم واتساب. الصور قد لا تظهر بشكل صحيح.';
            }
            
            // التحقق من اختيار المستخدم السابق
            const userChoice = localStorage.getItem('openInBrowser');
            
            if (userChoice === 'always' && detectedApp) {
                // إذا اختار المستخدم "دائماً" في المرة السابقة، نحوله مباشرة
                window.location.href = TARGET_URL;
            } else if (userChoice === 'never') {
                // إذا اختار "لا تسألني مرة أخرى"، نخفي الصفحة ونحوله
                document.getElementById('mainCard').classList.add('hidden');
                window.location.href = TARGET_URL;
            }
            
            // عد تنازلي اختياري للتحويل التلقائي
            let seconds = 5;
            const counterEl = document.getElementById('autoRedirectCounter');
            counterEl.textContent = `التحويل التلقائي خلال ${seconds} ثوانٍ...`;
            
            const interval = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    counterEl.textContent = `التحويل التلقائي خلال ${seconds} ثوانٍ...`;
                } else {
                    clearInterval(interval);
                    counterEl.textContent = 'جاري التحويل...';
                    window.location.href = TARGET_URL;
                }
            }, 1000);
            
            // زر الفتح في المتصفح
            document.getElementById('openInBrowserBtn').addEventListener('click', function(e) {
                e.preventDefault();
                const remember = document.getElementById('rememberChoice').checked;
                
                if (remember) {
                    localStorage.setItem('openInBrowser', 'always');
                }
                
                window.open(TARGET_URL, '_blank');
            });
            
            // زر الاستمرار داخل التطبيق
            document.getElementById('continueAnywayBtn').addEventListener('click', function(e) {
                e.preventDefault();
                const remember = document.getElementById('rememberChoice').checked;
                
                if (remember) {
                    localStorage.setItem('openInBrowser', 'never');
                }
                
                clearInterval(interval);
                window.location.href = TARGET_URL;
            });
        })();
    </script>
</body>
</html>
