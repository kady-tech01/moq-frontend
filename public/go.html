<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MoQawill - جاري التحويل</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #021024;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 30px;
            max-width: 400px;
        }
        h1 { margin-bottom: 20px; }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="box">
        <h1>MoQawill Club</h1>
        <p>اضغط على الزر لفتح الموقع في المتصفح الخارجي</p>
        <a href="https://moqawill.vercel.app" class="btn" target="_blank">🔗 فتح المتصفح</a>
        <a href="https://moqawill.vercel.app" class="btn" style="background: #555;">⏺️ استمرار هنا</a>
    </div>
    
    <script>
        // تحويل تلقائي بعد 3 ثواني
        setTimeout(function() {
            window.location.href = "https://moqawill.vercel.app";
        }, 3000);
    </script>
</body>
</html>
