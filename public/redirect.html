<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحويل إلى المتصفح</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #021024, #052659);
            color: white;
            text-align: center;
            direction: rtl;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        .counter {
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <h1>🚀 جاري التحويل</h1>
        <p>سيتم تحويلك إلى المتصفح الخارجي خلال لحظات...</p>
        
        <button class="button" id="redirectBtn">
            <span id="btnText">فتح في المتصفح الخارجي</span>
        </button>
        
        <div class="counter" id="counter"></div>
    </div>

    <script>
        // الرابط الأصلي للموقع
        const TARGET_URL = 'https://moqawill.vercel.app';
        
        // محاولات متعددة للتحويل
        function forceRedirect() {
            // الطريقة 1: window.location (الأساسية)
            window.location.href = TARGET_URL;
            
            // الطريقة 2: window.open بعد تأخير بسيط
            setTimeout(function() {
                window.open(TARGET_URL, '_blank');
            }, 100);
            
            // الطريقة 3: إنشاء رابط مؤقت والنقر عليه
            setTimeout(function() {
                const link = document.createElement('a');
                link.href = TARGET_URL;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 200);
            
            // الطريقة 4: للموبايل - محاولة فتح الرابط مباشرة
            setTimeout(function() {
                window.location.replace(TARGET_URL);
            }, 300);
        }
        
        // محاولة التحويل التلقائي بعد 1.5 ثانية
        setTimeout(forceRedirect, 1500);
        
        // عداد للعد التنازلي (اختياري)
        let seconds = 3;
        const counterEl = document.getElementById('counter');
        const interval = setInterval(function() {
            if (seconds > 0) {
                counterEl.textContent = `التحويل التلقائي خلال ${seconds} ثوانٍ...`;
                seconds--;
            } else {
                clearInterval(interval);
            }
        }, 1000);
        
        // زر للتحويل اليدوي
        document.getElementById('redirectBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const btn = this;
            const btnText = document.getElementById('btnText');
            
            // تغيير نص الزر
            btnText.innerHTML = '<span class="spinner"></span> جاري التحويل...';
            btn.disabled = true;
            
            // تنفيذ التحويل
            forceRedirect();
        });
        
        // كشف التطبيق الذي فتح الرابط (للتشخيص)
        const userAgent = navigator.userAgent;
        console.log('User Agent:', userAgent);
        
        // إذا كان المستخدم داخل تليجرام، نعدل النص قليلاً
        if (userAgent.includes('Telegram')) {
            document.querySelector('p').innerHTML = 'تم اكتشاف أنك تستخدم تليجرام. سيتم تحويلك إلى المتصفح الخارجي لتصفح أفضل.';
        } else if (userAgent.includes('FB') || userAgent.includes('Instagram')) {
            document.querySelector('p').innerHTML = 'تم اكتشاف أنك تستخدم تطبيق تواصل اجتماعي. سيتم تحويلك إلى المتصفح الخارجي.';
        }
    </script>
</body>
</html>
