<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoQawill - فتح الرابط</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #021024 0%, #052659 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            direction: rtl;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideIn 0.6s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 20px 45px rgba(59, 130, 246, 0.6);
            }
        }
        
        .logo svg {
            width: 60px;
            height: 60px;
            fill: #3b82f6;
        }
        
        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
        }
        
        .app-badge {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            padding: 8px 20px;
            display: inline-block;
            margin: 0 auto 20px;
            color: #ffc107;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 193, 7, 0.3);
            text-align: center;
        }
        
        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
            text-align: center;
            padding: 0 10px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .btn i, .btn span {
            font-size: 1.2rem;
        }
        
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .options input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        
        .counter {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            text-align: center;
        }
        
        .detected-app {
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="mainCard">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
            </div>
            
            <h1>MoQawill Club</h1>
            
            <div id="appBadge" class="app-badge">
                📱 تم اكتشاف تطبيق تواصل اجتماعي
            </div>
            
            <div id="message" class="message">
                للحصول على تجربة كاملة مع جميع الصور والميزات، ننصح بفتح الموقع في المتصفح الخارجي
            </div>
            
            <div class="button-group">
                <!-- زر فتح في المتصفح الخارجي - يحاول بطرق متعددة -->
                <a href="https://moqawill.vercel.app" 
                   class="btn btn-primary" 
                   id="openBrowserBtn"
                   target="_blank" 
                   rel="noopener noreferrer nofollow">
                    <span>🌐</span> فتح في المتصفح الخارجي
                    <span style="font-size: 0.9rem; opacity: 0.8;">(موصى به)</span>
                </a>
                
                <!-- زر الاستمرار داخل التطبيق -->
                <a href="https://moqawill.vercel.app" 
                   class="btn btn-secondary" 
                   id="continueBtn">
                    <span>📱</span> الاستمرار داخل التطبيق
                </a>
            </div>
            
            <div class="options">
                <label>
                    <input type="checkbox" id="rememberChoice">
                    <span>لا تسألني مرة أخرى (اختر المتصفح دائماً)</span>
                </label>
            </div>
            
            <div class="counter" id="counter"></div>
            <div class="detected-app" id="detectedApp"></div>
        </div>
    </div>
    
    <script>
        (function() {
            // الرابط المستهدف
            const TARGET_URL = 'https://moqawill.vercel.app';
            
            // ========== كشف التطبيق ==========
            const userAgent = navigator.userAgent;
            let detectedApp = 'غير معروف';
            let appMessage = '';
            
            if (userAgent.includes('Telegram')) {
                detectedApp = 'تليجرام';
                appMessage = '📱 تم اكتشاف تليجرام. الصور قد لا تظهر بشكل صحيح داخل التطبيق.';
            } else if (userAgent.includes('FB') || userAgent.includes('Instagram') || userAgent.includes('Messenger')) {
                detectedApp = 'فيسبوك / ماسنجر';
                appMessage = '📱 تم اكتشاف تطبيق فيسبوك. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('WhatsApp')) {
                detectedApp = 'واتساب';
                appMessage = '📱 تم اكتشاف واتساب. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('Twitter') || userAgent.includes('Tweetbot')) {
                detectedApp = 'تويتر';
                appMessage = '📱 تم اكتشاف تويتر. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('LinkedIn')) {
                detectedApp = 'لينكد إن';
                appMessage = '📱 تم اكتشاف لينكد إن. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('Viber')) {
                detectedApp = 'فايبر';
                appMessage = '📱 تم اكتشاف فايبر. الصور قد لا تظهر بشكل صحيح.';
            } else if (userAgent.includes('Line')) {
                detectedApp = 'لاين';
                appMessage = '📱 تم اكتشاف لاين. الصور قد لا تظهر بشكل صحيح.';
            }
            
            // عرض معلومات التطبيق المكتشف
            document.getElementById('detectedApp').textContent = `التطبيق: ${detectedApp}`;
            
            if (appMessage) {
                document.getElementById('message').innerHTML = appMessage;
            }
            
            // ========== نظام التذكر ==========
            const userPreference = localStorage.getItem('redirectPreference');
            
            if (userPreference === 'external') {
                // المستخدم اختار المتصفح دائماً - نحوله مباشرة
                window.location.href = TARGET_URL;
            } else if (userPreference === 'internal') {
                // المستخدم اختار البقاء داخل التطبيق - نخفي زر المتصفح
                document.getElementById('openBrowserBtn').style.display = 'none';
            }
            
            // ========== عد تنازلي ==========
            let seconds = 7;
            const counterEl = document.getElementById('counter');
            counterEl.textContent = `سيتم فتح الموقع تلقائياً خلال ${seconds} ثوانٍ...`;
            
            const interval = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    counterEl.textContent = `سيتم فتح الموقع تلقائياً خلال ${seconds} ثوانٍ...`;
                } else {
                    clearInterval(interval);
                    counterEl.textContent = 'جاري فتح الموقع...';
                    
                    // إذا ما اختار المستخدم شيء، نفتح الموقع عادي
                    window.location.href = TARGET_URL;
                }
            }, 1000);
            
            // ========== عند الضغط على زر المتصفح ==========
            document.getElementById('openBrowserBtn').addEventListener('click', function(e) {
                // إيقاف التحويل التلقائي
                clearInterval(interval);
                
                // حفظ اختيار المستخدم
                if (document.getElementById('rememberChoice').checked) {
                    localStorage.setItem('redirectPreference', 'external');
                }
                
                // عدة محاولات لفتح الرابط في المتصفح الخارجي
                try {
                    // المحاولة 1: target="_blank"
                    window.open(TARGET_URL, '_blank');
                    
                    // المحاولة 2: window.location
                    setTimeout(() => {
                        window.location.href = TARGET_URL;
                    }, 100);
                    
                    // المحاولة 3: إنشاء رابط مخفي
                    setTimeout(() => {
                        const link = document.createElement('a');
                        link.href = TARGET_URL;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }, 200);
                } catch (error) {
                    console.log('خطأ في الفتح:', error);
                }
            });
            
            // ========== عند الضغط على زر الاستمرار داخل التطبيق ==========
            document.getElementById('continueBtn').addEventListener('click', function(e) {
                // إيقاف التحويل التلقائي
                clearInterval(interval);
                
                // حفظ اختيار المستخدم
                if (document.getElementById('rememberChoice').checked) {
                    localStorage.setItem('redirectPreference', 'internal');
                }
                
                // فتح الرابط داخل التطبيق
                window.location.href = TARGET_URL;
            });
        })();
    </script>
</body>
</html>
